# .github/workflows/ci.yml — Continuous Integration Pipeline
#
# Trigger: runs on every push or pull request to main/develop.
# What it does:
#   1. Installs Python + dependencies
#   2. Runs all 27 pytest tests
#   3. Reports pass/fail as a GitHub check
#
# This means every PR shows a green ✅ or red ❌ before merging.
# You can add a badge to your README to show build status.
#
# How to read this file:
#   on:       → when does this run?
#   jobs:     → what tasks to execute?
#   steps:    → sub-tasks within each job (run sequentially)
#   uses:     → reuse a pre-built action from GitHub marketplace
#   run:      → shell command to execute

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend Tests ─────────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest      # Free Linux runner in GitHub's cloud

    defaults:
      run:
        working-directory: backend  # All steps run from the backend/ folder

    steps:
      # 1. Check out the code from the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Python 3.12
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Cache pip downloads to speed up future runs
      #    Cache key includes requirements.txt hash — invalidates if deps change
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      # 4. Install all Python dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 5. Create a minimal .env so the app can import settings
      #    (Tests use SQLite, but config.py still requires these vars to exist)
      - name: Create test .env
        run: |
          cat > .env << EOF
          DATABASE_URL=sqlite:///./test.db
          SECRET_KEY=ci-test-secret-key-not-for-production
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          EOF

      # 6. Run all tests with verbose output and coverage summary
      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short

  # ── Frontend Lint/Build Check ─────────────────────────────────────────
  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci          # Like npm install but uses lockfile exactly (reproducible)

      - name: Create frontend .env
        run: echo "VITE_API_URL=http://localhost:4002" > .env

      - name: Build production bundle
        run: npm run build   # Catches TypeScript errors, import errors, etc.

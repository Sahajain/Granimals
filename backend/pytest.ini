[pytest]
# Tell pytest where to look for tests
testpaths = tests

# Show extra info by default
addopts = -v --tb=short

# Silence known deprecation warnings that come from our dependencies
filterwarnings =
    ignore::DeprecationWarning:passlib
    ignore::DeprecationWarning:jose
    ignore::sqlalchemy.exc.MovedIn20Warning

# asyncio mode (for pytest-asyncio)
asyncio_mode = auto
